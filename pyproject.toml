[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridata"
version = "0.1.0"
description = "Measuring verifiable reliability of data analysis agents via Silent Error Rate (SER)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "databench-eval>=4.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veridata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
