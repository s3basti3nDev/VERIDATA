# VERIDATA — baseline run configuration
# All model identifiers are pinned exactly for reproducibility.
# To rerun with identical conditions, keep this file unchanged.

[model]
model_id    = "claude-sonnet-4-6"
temperature = 0.0     # deterministic outputs; logged in every run record
max_tokens  = 1024

[dataset]
name        = "semeval"   # databench-eval dataset name
split       = "dev"       # evaluation split
sample_size = 50          # full baseline run
smoke_size  = 10          # --smoke flag: pipeline validation, low cost

[execution]
timeout_seconds = 30       # per-question code execution ceiling
max_rows        = 50_000   # rows fed to exec(); larger tables are truncated

[paths]
runs_dir = "runs"   # relative to project root; holds per-run .jsonl files

[invariants]
duplicate_row_threshold = 0.05   # dup fraction above which duplicate_rows fires
outlier_iqr_factor      = 5.0   # k in Q1-k*IQR / Q3+k*IQR; strict to limit false positives
trivial_constants       = [0, 1, 2, -1, 100, 0.5]  # excluded from unexplained_constant
